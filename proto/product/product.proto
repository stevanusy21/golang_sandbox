syntax = "proto3";

package product;

option go_package = "github.com/stevanusy21/golang_sandbox/proto/product;product";

// Service ini dikonsumsi oleh Order Service.
service ProductService {
    // Untuk mendapatkan detail product berdasarkan ID.
    rpc GetProductDetail(ProductDetailRequest) returns (ProductDetailResponse);
    // Untuk mengurangi stock product berdasarkan ID.
    rpc DeductStock(DeductStockRequest) returns (DeductStockResponse);
}

message DeductStockRequest {
    int32 product_id = 1;
    int32 quantity = 2;
}

message DeductStockResponse {
    bool is_success = 1;
    string message = 2;
}

message ProductDetailRequest {
    int32 product_id = 1;
}

message ProductDetailResponse {
    int32 product_id = 1;
    string name = 2;
    double price = 3;
    int32 stock = 4;
}